# Attaches prebuilt binaries to a GitHub release when it is published, and
# updates the Homebrew cask in ville6000/homebrew-tap. Publish releases as
# before (with a new vX.Y.Z tag); this builds and uploads the archives and
# checksums.txt to it.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  # Signing the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Don't attach binaries for a tag that fails its tests.
      - run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Signed provenance for every archive, so users can check a download was
      # built by this workflow: gh attestation verify <archive> --repo ville6000/tfs --signer-workflow ville6000/tfs/.github/workflows/release.yml
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
